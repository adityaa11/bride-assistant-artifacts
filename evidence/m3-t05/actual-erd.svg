<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img"><title>M3-T05 actual unchanged booking schema ERD</title><rect width="1600" height="1220" fill="#fff9f7"/><g font-family="Arial,sans-serif"><text x="35" y="52" fill="#332b32" font-size="30">M3-T05 · actual unchanged schema</text><text x="35" y="91" fill="#693a53" font-size="20">Before and after T05: same fresh PostgreSQL 18.7 schema · migrations 0001–0005</text><text x="35" y="125" fill="#332b32" font-size="17">11 affected public tables · 11 PKs · 14 FKs · auth.user(id PK) is the external identity target</text><text x="35" y="153" fill="#332b32" font-size="16">Each FK child belongs to one parent; each parent may have 0..N children. booking.promotion_id is nullable (0..1 promotion per booking).</text><g><rect x="35" y="190" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="35" y="190" width="480" height="45" rx="12" fill="#82536e"/><text x="51" y="220" fill="#fff" font-size="20" font-weight="bold">public.catalogue_types</text><text x="51" y="272" fill="#332b32" font-size="16">PK id</text></g><g><rect x="555" y="190" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="555" y="190" width="480" height="45" rx="12" fill="#82536e"/><text x="571" y="220" fill="#fff" font-size="20" font-weight="bold">public.catalogue</text><text x="571" y="272" fill="#332b32" font-size="16">FK catalogue_type_id → catalogue_types (1 : 0..N)</text><text x="571" y="300" fill="#332b32" font-size="16">PK id</text></g><g><rect x="1075" y="190" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="1075" y="190" width="480" height="45" rx="12" fill="#82536e"/><text x="1091" y="220" fill="#fff" font-size="20" font-weight="bold">public.bundle</text><text x="1091" y="272" fill="#332b32" font-size="16">PK id</text></g><g><rect x="35" y="440" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="35" y="440" width="480" height="45" rx="12" fill="#82536e"/><text x="51" y="470" fill="#fff" font-size="20" font-weight="bold">public.bundle_catalogue</text><text x="51" y="522" fill="#332b32" font-size="16">FK bundle_id → bundle (1 : 0..N)</text><text x="51" y="550" fill="#332b32" font-size="16">FK catalogue_id → catalogue (1 : 0..N)</text><text x="51" y="578" fill="#332b32" font-size="16">PK bundle_id,catalogue_id</text></g><g><rect x="555" y="440" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="555" y="440" width="480" height="45" rx="12" fill="#82536e"/><text x="571" y="470" fill="#fff" font-size="20" font-weight="bold">public.master_package</text><text x="571" y="522" fill="#332b32" font-size="16">PK id</text></g><g><rect x="1075" y="440" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="1075" y="440" width="480" height="45" rx="12" fill="#82536e"/><text x="1091" y="470" fill="#fff" font-size="20" font-weight="bold">public.package_catalogue</text><text x="1091" y="522" fill="#332b32" font-size="16">FK catalogue_id → catalogue (1 : 0..N)</text><text x="1091" y="550" fill="#332b32" font-size="16">FK package_id → master_package (1 : 0..N)</text><text x="1091" y="578" fill="#332b32" font-size="16">PK package_id,catalogue_id</text></g><g><rect x="35" y="690" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="35" y="690" width="480" height="45" rx="12" fill="#82536e"/><text x="51" y="720" fill="#fff" font-size="20" font-weight="bold">public.package_bundle</text><text x="51" y="772" fill="#332b32" font-size="16">FK bundle_id → bundle (1 : 0..N)</text><text x="51" y="800" fill="#332b32" font-size="16">FK package_id → master_package (1 : 0..N)</text><text x="51" y="828" fill="#332b32" font-size="16">PK package_id,bundle_id</text></g><g><rect x="555" y="690" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="555" y="690" width="480" height="45" rx="12" fill="#82536e"/><text x="571" y="720" fill="#fff" font-size="20" font-weight="bold">public.promotion</text><text x="571" y="772" fill="#332b32" font-size="16">PK id</text></g><g><rect x="1075" y="690" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="1075" y="690" width="480" height="45" rx="12" fill="#82536e"/><text x="1091" y="720" fill="#fff" font-size="20" font-weight="bold">public.promotion_package</text><text x="1091" y="772" fill="#332b32" font-size="16">FK package_id → master_package (1 : 0..N)</text><text x="1091" y="800" fill="#332b32" font-size="16">FK promotion_id → promotion (1 : 0..N)</text><text x="1091" y="828" fill="#332b32" font-size="16">PK promotion_id,package_id</text></g><g><rect x="35" y="940" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="35" y="940" width="480" height="45" rx="12" fill="#82536e"/><text x="51" y="970" fill="#fff" font-size="20" font-weight="bold">public.booking</text><text x="51" y="1022" fill="#332b32" font-size="16">FK customer_id → auth."user" (1 : 0..N)</text><text x="51" y="1050" fill="#332b32" font-size="16">FK package_id → master_package (1 : 0..N)</text><text x="51" y="1078" fill="#332b32" font-size="16">FK promotion_id → promotion (1 : 0..N)</text><text x="51" y="1106" fill="#332b32" font-size="16">PK id</text></g><g><rect x="555" y="940" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="555" y="940" width="480" height="45" rx="12" fill="#82536e"/><text x="571" y="970" fill="#fff" font-size="20" font-weight="bold">public.booking_status_history</text><text x="571" y="1022" fill="#332b32" font-size="16">FK actor_id → auth."user" (1 : 0..N)</text><text x="571" y="1050" fill="#332b32" font-size="16">FK booking_id → booking (1 : 0..N)</text><text x="571" y="1078" fill="#332b32" font-size="16">PK id</text></g><text x="35" y="1191" fill="#693a53" font-size="17">0004 catalogue/package/promotion · 0005 booking/history · no T05 migration or production seed</text></g></svg>