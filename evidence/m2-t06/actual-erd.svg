<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="610" viewBox="0 0 1140 610" role="img" aria-label="M2-T06 unchanged PostgreSQL schema ERD">
  <rect width="1140" height="610" fill="#f8f5f2"/>
  <text x="48" y="49" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#302a30">M2-T06 · unchanged PostgreSQL schema</text>
  <text x="48" y="77" font-family="Arial,sans-serif" font-size="15" fill="#665b63">Fresh Docker PostgreSQL 18.7 · migrations 0001 + 0002 · no T06 schema change</text>
  <g font-family="Arial,sans-serif" font-size="15" fill="#302a30" stroke="#d9cbd2" stroke-width="2">
    <rect x="390" y="130" width="360" height="165" rx="10" fill="white"/>
    <rect x="47" y="365" width="330" height="145" rx="10" fill="white"/>
    <rect x="762" y="365" width="330" height="145" rx="10" fill="white"/>
    <rect x="47" y="130" width="300" height="125" rx="10" fill="white"/>
    <rect x="792" y="130" width="300" height="125" rx="10" fill="white"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#302a30">
    <text x="410" y="162" font-size="19" font-weight="700">auth.user</text>
    <text x="410" y="194" font-size="15">PK  id</text>
    <text x="410" y="220" font-size="15">UNIQUE  email</text>
    <text x="410" y="246" font-size="15">role ∈ {customer, admin}</text>
    <text x="410" y="273" font-size="13" fill="#665b63">Server-owned identity and role</text>
    <text x="67" y="398" font-size="19" font-weight="700">auth.session</text>
    <text x="67" y="430" font-size="15">PK  id</text>
    <text x="67" y="456" font-size="15">FK  userId → auth.user.id</text>
    <text x="67" y="482" font-size="13" fill="#665b63">ON DELETE CASCADE</text>
    <text x="782" y="398" font-size="19" font-weight="700">auth.account</text>
    <text x="782" y="430" font-size="15">PK  id</text>
    <text x="782" y="456" font-size="15">FK  userId → auth.user.id</text>
    <text x="782" y="482" font-size="13" fill="#665b63">ON DELETE CASCADE</text>
    <text x="67" y="162" font-size="19" font-weight="700">auth.verification</text>
    <text x="67" y="194" font-size="15">PK  id</text>
    <text x="67" y="221" font-size="13" fill="#665b63">No foreign key</text>
    <text x="812" y="162" font-size="19" font-weight="700">public.schema_migrations</text>
    <text x="812" y="194" font-size="15">PK  version</text>
    <text x="812" y="221" font-size="13" fill="#665b63">No foreign key · 0001 ledger</text>
  </g>
  <g stroke="#ae6984" stroke-width="3" fill="none">
    <path d="M 465 295 L 278 365"/>
    <path d="M 675 295 L 862 365"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#753c55" font-weight="700">
    <text x="336" y="321">1 → 0..*</text>
    <text x="730" y="321">1 → 0..*</text>
  </g>
  <text x="48" y="565" font-family="Arial,sans-serif" font-size="14" fill="#665b63">0002 owns auth identity/session tables; 0001 owns only the migration ledger. T06 uses only disposable, rolled-back contract records.</text>
</svg>

