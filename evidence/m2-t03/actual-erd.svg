<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title description">
<title id="title">M2-T03 actual fresh migrated database ERD</title>
<desc id="description">Before migration, the public schema has no tables. After migration 0001, it contains only schema_migrations, with version as primary key, checksum and applied_at. There are no foreign keys or relationships.</desc>
<rect width="1120" height="490" fill="#f8fafc"/>
<text x="50" y="54" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#102a43">M2-T03 · actual fresh database schema</text>
<text x="50" y="88" font-family="Arial,sans-serif" font-size="16" fill="#486581">Compared with PostgreSQL 18.7 information_schema and pg catalog after migration 0001</text>
<rect x="50" y="126" width="414" height="260" rx="14" fill="#fff" stroke="#9fb3c8" stroke-width="2"/>
<text x="76" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#102a43">Before · fresh public schema</text>
<text x="76" y="222" font-family="Arial,sans-serif" font-size="18" fill="#486581">No tables</text>
<text x="76" y="258" font-family="Arial,sans-serif" font-size="16" fill="#627d98">No primary keys, foreign keys, or rows</text>
<text x="76" y="348" font-family="Arial,sans-serif" font-size="15" fill="#486581">Fresh Docker database observation</text>
<path d="M487 253h100m-23-18 23 18-23 18" fill="none" stroke="#334e68" stroke-width="3"/>
<text x="504" y="217" font-family="Arial,sans-serif" font-size="15" fill="#334e68">0001</text>
<rect x="609" y="126" width="461" height="260" rx="14" fill="#fff" stroke="#3e7bfa" stroke-width="2"/>
<path d="M623 126h433a14 14 0 0 1 14 14v43H609v-43a14 14 0 0 1 14-14" fill="#d9e8ff"/>
<text x="635" y="165" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#102a43">public.schema_migrations</text>
<text x="635" y="223" font-family="Arial,sans-serif" font-size="17" fill="#102a43">PK  version         text · NOT NULL</text>
<text x="635" y="264" font-family="Arial,sans-serif" font-size="17" fill="#102a43">      checksum    text · NOT NULL</text>
<text x="635" y="305" font-family="Arial,sans-serif" font-size="17" fill="#102a43">      applied_at    timestamptz · NOT NULL</text>
<text x="635" y="354" font-family="Arial,sans-serif" font-size="15" fill="#486581">1 migration row · 0 business rows</text>
<text x="50" y="425" font-family="Arial,sans-serif" font-size="16" fill="#102a43">FKs: none   ·   Relationships/cardinalities: none   ·   No auth or domain tables</text>
<text x="50" y="455" font-family="Arial,sans-serif" font-size="14" fill="#627d98">0001_schema_migrations.sql → after state. Docker fresh migration and named Neon branch introspection agree.</text>
