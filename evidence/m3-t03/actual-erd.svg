<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><title>M3-T03 actual unchanged schema</title><rect width="1600" height="960" fill="#fff9f7"/><g font-family="Arial,sans-serif" fill="#332b32"><text x="30" y="55" font-size="30">M3-T03 actual ERD · fresh PostgreSQL 18.7</text><text x="30" y="96" font-size="20">Before and after T03: unchanged M3-SQL-01 (0004) schema</text><text x="30" y="135" font-size="18">Each FK points to its parent; parent 1 : child 0..N. Composite membership PKs shown below.</text><g><rect x="30" y="185" width="480" height="210" fill="white" stroke="#82536e" stroke-width="2"/><text x="45" y="217" font-size="20" font-weight="bold">catalogue_types</text><text x="45" y="255" font-size="17">PK id</text></g><g><rect x="550" y="185" width="480" height="210" fill="white" stroke="#82536e" stroke-width="2"/><text x="565" y="217" font-size="20" font-weight="bold">catalogue</text><text x="565" y="255" font-size="17">FK catalogue_type_id → catalogue_types (1 : 0..N)</text><text x="565" y="285" font-size="17">PK id</text></g><g><rect x="1070" y="185" width="480" height="210" fill="white" stroke="#82536e" stroke-width="2"/><text x="1085" y="217" font-size="20" font-weight="bold">bundle</text><text x="1085" y="255" font-size="17">PK id</text></g><g><rect x="30" y="435" width="480" height="210" fill="white" stroke="#82536e" stroke-width="2"/><text x="45" y="467" font-size="20" font-weight="bold">bundle_catalogue</text><text x="45" y="505" font-size="17">FK bundle_id → bundle (1 : 0..N)</text><text x="45" y="535" font-size="17">FK catalogue_id → catalogue (1 : 0..N)</text><text x="45" y="565" font-size="17">PK bundle_id,catalogue_id</text></g><g><rect x="550" y="435" width="480" height="210" fill="white" stroke="#82536e" stroke-width="2"/><text x="565" y="467" font-size="20" font-weight="bold">master_package</text><text x="565" y="505" font-size="17">PK id</text></g><g><rect x="1070" y="435" width="480" height="210" fill="white" stroke="#82536e" stroke-width="2"/><text x="1085" y="467" font-size="20" font-weight="bold">package_catalogue</text><text x="1085" y="505" font-size="17">FK catalogue_id → catalogue (1 : 0..N)</text><text x="1085" y="535" font-size="17">FK package_id → master_package (1 : 0..N)</text><text x="1085" y="565" font-size="17">PK package_id,catalogue_id</text></g><g><rect x="30" y="685" width="480" height="210" fill="white" stroke="#82536e" stroke-width="2"/><text x="45" y="717" font-size="20" font-weight="bold">package_bundle</text><text x="45" y="755" font-size="17">FK bundle_id → bundle (1 : 0..N)</text><text x="45" y="785" font-size="17">FK package_id → master_package (1 : 0..N)</text><text x="45" y="815" font-size="17">PK package_id,bundle_id</text></g><g><rect x="550" y="685" width="480" height="210" fill="white" stroke="#82536e" stroke-width="2"/><text x="565" y="717" font-size="20" font-weight="bold">promotion</text><text x="565" y="755" font-size="17">PK id</text></g><g><rect x="1070" y="685" width="480" height="210" fill="white" stroke="#82536e" stroke-width="2"/><text x="1085" y="717" font-size="20" font-weight="bold">promotion_package</text><text x="1085" y="755" font-size="17">FK package_id → master_package (1 : 0..N)</text><text x="1085" y="785" font-size="17">FK promotion_id → promotion (1 : 0..N)</text><text x="1085" y="815" font-size="17">PK promotion_id,package_id</text></g></g></svg>