kage (1 : 0..N)</text><text x="1091" y="743" fill="#332b32" font-size="16">PK package_id,catalogue_id</text></g><g><rect x="35" y="855" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="35" y="855" width="480" height="45" rx="12" fill="#82536e"/><text x="51" y="885" fill="#fff" font-size="20" font-weight="bold">public.package_bundle</text><text x="51" y="937" fill="#332b32" font-size="16">FK bundle_id → bundle (1 : 0..N)</text><text x="51" y="965" fill="#332b32" font-size="16">FK package_id → master_package (1 : 0..N)</text><text x="51" y="993" fill="#332b32" font-size="16">PK package_id,bundle_id</text></g><g><rect x="555" y="855" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="555" y="855" width="480" height="45" rx="12" fill="#82536e"/><text x="571" y="885" fill="#fff" font-size="20" font-weight="bold">public.promotion</text><text x="571" y="937" fill="#332b32" font-size="16">PK id</text></g><g><rect x="1075" y="855" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="1075" y="855" width="480" height="45" rx="12" fill="#82536e"/><text x="1091" y="885" fill="#fff" font-size="20" font-weight="bold">public.promotion_package</text><text x="1091" y="937" fill="#332b32" font-size="16">FK package_id → master_package (1 : 0..N)</text><text x="1091" y="965" fill="#332b32" font-size="16">FK promotion_id → promotion (1 : 0..N)</text><text x="1091" y="993" fill="#332b32" font-size="16">PK promotion_id,package_id</text></g><g><rect x="35" y="1105" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="35" y="1105" width="480" height="45" rx="12" fill="#82536e"/><text x="51" y="1135" fill="#fff" font-size="20" font-weight="bold">public.booking</text><text x="51" y="1187" fill="#332b32" font-size="16">FK customer_id → auth."user" (1 : 0..N)</text><text x="51" y="1215" fill="#332b32" font-size="16">FK package_id → master_package (