<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img"><title>M3-T07 actual before and after booking date ERD</title><rect width="1600" height="1700" fill="#fff9f7"/><g font-family="Arial,sans-serif"><text x="35" y="52" fill="#332b32" font-size="30">M3-T07 · actual booking date schema</text><text x="35" y="86" fill="#693a53" font-size="20">Before 0006 · 11 public tables; no reservation or closure table</text><rect x="35" y="105" width="1520" height="155" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><text x="55" y="137" font-size="19">public.booking: id PK; customer_id FK → auth.user; package_id FK → master_package; promotion_id nullable FK → promotion</text><text x="55" y="170" font-size="19">public.booking_status_history: id PK; booking_id FK → booking; actor_id FK → auth.user</text><text x="55" y="203" font-size="18">booking 1 : 0..N history; auth.user 1 : 0..N bookings/events; package 1 : 0..N bookings</text><text x="55" y="236" font-size="18">Existing catalogue/package tables and auth.user(id PK) remain unchanged.</text><text x="35" y="296" fill="#693a53" font-size="20">After 0006 · 13 public tables · 13 PKs · 16 FKs · auth.user(id PK) external identity target</text><text x="35" y="327" fill="#332b32" font-size="17">booking 1 : 0..1 reservation; auth.user 1 : 0..N closures; reservation wedding_date UNIQUE; closure date PK.</text><g><rect x="35" y="355" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="35" y="355" width="480" height="45" rx="12" fill="#82536e"/><text x="51" y="385" fill="#fff" font-size="20" font-weight="bold">public.catalogue_types</text><text x="51" y="437" fill="#332b32" font-size="16">PK id</text><text x="51" y="465" fill="#332b32" font-size="16">UNIQUE code</text><text x="51" y="493" fill="#332b32" font-size="16">UNIQUE label</text></g><g><rect x="555" y="355" width="480" height="215" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x=