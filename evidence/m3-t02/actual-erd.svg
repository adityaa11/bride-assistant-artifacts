<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img"><title>M3-T02 actual unchanged schema ERD</title><rect width="1600" height="1040" fill="#fff9f7"/><g font-family="Arial,sans-serif"><text x="35" y="56" fill="#332b32" font-size="31">M3-T02 actual ERD · fresh PostgreSQL 18.7</text><text x="35" y="100" fill="#693a53" font-size="21">Before and after T02: unchanged M3-SQL-01 (0004) schema</text><text x="35" y="139" fill="#332b32" font-size="18">0001 ledger · 0002 auth identity · 0003 admin bootstrap · 0004 nine catalogue/package/promotion tables</text><text x="35" y="178" fill="#332b32" font-size="18">Each FK points to its parent; parent 1 : child 0..N. Membership tables have composite PKs.</text><g><rect x="35" y="230" width="475" height="210" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="35" y="230" width="475" height="44" rx="12" fill="#82536e"/><text x="51" y="259" fill="#fff" font-size="21" font-weight="bold">catalogue_types</text><text x="51" y="307" fill="#332b32" font-size="17">PK id</text></g><g><rect x="555" y="230" width="475" height="210" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="555" y="230" width="475" height="44" rx="12" fill="#82536e"/><text x="571" y="259" fill="#fff" font-size="21" font-weight="bold">catalogue</text><text x="571" y="307" fill="#332b32" font-size="17">FK catalogue_type_id → catalogue_types  (1 : 0..N)</text><text x="571" y="334" fill="#332b32" font-size="17">PK id</text></g><g><rect x="1075" y="230" width="475" height="210" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="1075" y="230" width="475" height="44" rx="12" fill="#82536e"/><text x="1091" y="259" fill="#fff" font-size="21" font-weight="bold">bundle</text><text x="1091" y="307" fill="#332b32" font-size="17">PK id</text></g><g><rect x="35" y="480" width="475" height="210" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="35" y="480" width="475" height="44" rx="12" fill="#82536e"/><text x="51" y="509" fill="#fff" font-size="21" font-weight="bold">bundle_catalogue</text><text x="51" y="557" fill="#332b32" font-size="17">FK bundle_id → bundle  (1 : 0..N)</text><text x="51" y="584" fill="#332b32" font-size="17">FK catalogue_id → catalogue  (1 : 0..N)</text><text x="51" y="611" fill="#332b32" font-size="17">PK bundle_id,catalogue_id</text></g><g><rect x="555" y="480" width="475" height="210" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="555" y="480" width="475" height="44" rx="12" fill="#82536e"/><text x="571" y="509" fill="#fff" font-size="21" font-weight="bold">master_package</text><text x="571" y="557" fill="#332b32" font-size="17">PK id</text></g><g><rect x="1075" y="480" width="475" height="210" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="1075" y="480" width="475" height="44" rx="12" fill="#82536e"/><text x="1091" y="509" fill="#fff" font-size="21" font-weight="bold">package_catalogue</text><text x="1091" y="557" fill="#332b32" font-size="17">FK catalogue_id → catalogue  (1 : 0..N)</text><text x="1091" y="584" fill="#332b32" font-size="17">FK package_id → master_package  (1 : 0..N)</text><text x="1091" y="611" fill="#332b32" font-size="17">PK package_id,catalogue_id</text></g><g><rect x="35" y="730" width="475" height="210" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="35" y="730" width="475" height="44" rx="12" fill="#82536e"/><text x="51" y="759" fill="#fff" font-size="21" font-weight="bold">package_bundle</text><text x="51" y="807" fill="#332b32" font-size="17">FK bundle_id → bundle  (1 : 0..N)</text><text x="51" y="834" fill="#332b32" font-size="17">FK package_id → master_package  (1 : 0..N)</text><text x="51" y="861" fill="#332b32" font-size="17">PK package_id,bundle_id</text></g><g><rect x="555" y="730" width="475" height="210" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="555" y="730" width="475" height="44" rx="12" fill="#82536e"/><text x="571" y="759" fill="#fff" font-size="21" font-weight="bold">promotion</text><text x="571" y="807" fill="#332b32" font-size="17">PK id</text></g><g><rect x="1075" y="730" width="475" height="210" rx="12" fill="#fff" stroke="#82536e" stroke-width="2"/><rect x="1075" y="730" width="475" height="44" rx="12" fill="#82536e"/><text x="1091" y="759" fill="#fff" font-size="21" font-weight="bold">promotion_package</text><text x="1091" y="807" fill="#332b32" font-size="17">FK package_id → master_package  (1 : 0..N)</text><text x="1091" y="834" fill="#332b32" font-size="17">FK promotion_id → promotion  (1 : 0..N)</text><text x="1091" y="861" fill="#332b32" font-size="17">PK promotion_id,package_id</text></g></g></svg>