<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">M3 revised ERD preview</title><desc id="desc">Before state and proposed catalogue, booking, and date reservation schema with primary keys, foreign keys, and cardinalities.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#332b32}.h{font-size:28px;font-weight:700}.s{font-size:16px}.p{font-size:20px;font-weight:700;fill:#693a53}.t{font-size:17px;font-weight:700;fill:#fff}.f{font-size:15px}.r{font-size:15px;font-weight:600}.box{fill:#fff;stroke:#bc9cac;stroke-width:2}.bar{fill:#82536e}</style>
<rect width="1400" height="1080" fill="#fff9f7"/><text x="30" y="42" class="h">M3 revised SQL proposal · confirmation pending</text><text x="30" y="68" class="s">Planning preview only · no M3 migration written or run</text>
<text x="30" y="108" class="p">Before M3 · 0001–0003 unchanged</text>
<rect x="30" y="125" width="1340" height="106" rx="10" class="box"/><text x="45" y="151" class="f">public.schema_migrations: version (PK) · auth.user: id (PK) · auth.session: id (PK), userId (FK → auth.user.id)</text><text x="45" y="179" class="f">auth.account: id (PK), userId (FK → auth.user.id) · auth.verification: id (PK)</text><text x="45" y="207" class="f">app.admin_bootstrap_state: bootstrap_key (PK), initial_user_id (nullable FK → auth.user.id)</text>
<text x="30" y="271" class="p">After M3-SQL-01 · catalogue, bundle, package, promotion</text>
<rect x="30" y="289" width="650" height="300" rx="10" class="box"/><rect x="30" y="289" width="650" height="35" rx="10" class="bar"/><text x="45" y="313" class="t">Types and catalogue composition</text><text x="45" y="350" class="f">catalogue_types: id (PK)</text><text x="45" y="379" class="f">catalogue: id (PK), catalogue_type_id (FK → catalogue_types.id)</text><text x="45" y="408" class="f">bundle: id (PK)</text><text x="45" y="437" class="f">bundle_catalogue: bundle_id + catalogue_id (composite PK)</text><text x="45" y="466" class="f">bundle_id (FK → bundle.id); catalogue_id (FK → catalogue.id)</text><text x="45" y="505" class="r">type 1 : 0..N catalogue · bundle 1 : 0..N membership</text><text x="45" y="534" class="r">catalogue 1 : 0..N bundle membership</text>
<rect x="700" y="289" width="670" height="300" rx="10" class="box"/><rect x="700" y="289" width="670" height="35" rx="10" class="bar"/><text x="715" y="313" class="t">Package and promotion</text><text x="715" y="350" class="f">master_package: id (PK) · promotion: id (PK)</text><text x="715" y="379" class="f">package_catalogue: package_id + catalogue_id (PK, FKs)</text><text x="715" y="408" class="f">package_bundle: package_id + bundle_id (PK, FKs)</text><text x="715" y="437" class="f">promotion_package: promotion_id + package_id (PK, FKs)</text><text x="715" y="476" class="r">package 1 : 0..N direct items / bundles</text><text x="715" y="505" class="r">catalogue or bundle 1 : 0..N package membership</text><text x="715" y="534" class="r">promotion 1 : 0..N package links; package 1 : 0..N links</text>
<text x="30" y="630" class="p">After M3-SQL-04 · booking aggregate</text>
<rect x="30" y="650" width="650" height="170" rx="10" class="box"/><rect x="30" y="650" width="650" height="35" rx="10" class="bar"/><text x="45" y="674" class="t">booking</text><text x="45" y="711" class="f">id (PK); submission_key (UNIQUE with customer_id)</text><text x="45" y="740" class="f">customer_id (FK → auth.user.id); package_id (FK → master_package.id)</text><text x="45" y="769" class="f">promotion_id (nullable FK → promotion.id)</text><text x="45" y="799" class="f">submission_snapshot / payload_hash / wedding_start_time</text><text x="45" y="838" class="r">user/package 1 : 0..N bookings; promotion 1 : 0..N</text>
<rect x="700" y="650" width="670" height="170" rx="10" class="box"/><rect x="700" y="650" width="670" height="35" rx="10" class="bar"/><text x="715" y="674" class="t">booking_status_history</text><text x="715" y="711" class="f">id (PK); booking_id (FK → booking.id)</text><text x="715" y="740" class="f">actor_id (FK → auth.user.id)</text><text x="715" y="780" class="r">booking 1 : 1..N events; actor 1 : 0..N events</text>
<text x="30" y="861" class="p">After M3-SQL-07 · durable reservation and admin closure</text>
<rect x="30" y="880" width="650" height="140" rx="10" class="box"/><rect x="30" y="880" width="650" height="35" rx="10" class="bar"/><text x="45" y="904" class="t">booking_date_reservation</text><text x="45" y="941" class="f">booking_id (PK, FK → booking.id); wedding_date (UNIQUE)</text><text x="45" y="981" class="r">booking 1 : 0..1 reservation</text>
<rect x="700" y="880" width="670" height="140" rx="10" class="box"/><rect x="700" y="880" width="670" height="35" rx="10" class="bar"/><text x="715" y="904" class="t">admin_closed_date</text><text x="715" y="941" class="f">date (PK); closed_by (FK → auth.user.id)</text><text x="715" y="981" class="r">admin 1 : 0..N closures · closure ⇄ reservation: date lock</text>
<text x="30" y="1053" class="s">A reservation persists through pending cancellation/reschedule; only approval releases or moves it. Date lock is a cross-table invariant, not a FK.</text>
</svg>
