<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900" role="img" aria-labelledby="title desc"><title id="title">M3 proposed entity relationship diagram, before and cumulative after states</title><desc id="desc">Current schema migration ledger and authentication tables, followed by proposed service/action, bundle, package, promotion, booking and date protection tables. Every affected table lists primary and foreign keys; relationship cardinalities are named below each phase.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#342b32}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#6a5963}.phase{font-size:24px;font-weight:700;fill:#643f55}.phaseSub{font-size:15px;fill:#765e6d}.tableTitle{font-size:18px;font-weight:700;fill:#fff}.field{font-size:14px}.rel{font-size:16px;font-weight:550}.small{font-size:14px;fill:#5d5260}</style><rect width="1800" height="1900" fill="#fffaf8"/><text x="30" y="42" class="title">M3 SQL proposal · reviewer-visible ERD</text><text x="30" y="67" class="sub">Revised lookup-table preview · no M3 migration written or run · source commit 1513413</text><rect x="25" y="85" width="1750" height="304" rx="14" fill="#fff" stroke="#decbd4" stroke-width="2"/><text x="48" y="120" class="phase">Before M3 · current schema</text><text x="48" y="144" class="phaseSub">0001 migration ledger + 0002 Better Auth identity; M3 leaves these tables unchanged</text><rect x="48" y="161" width="410" height="118" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="48" y="161" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="48" y="186" width="410" height="10" fill="#8b5d76"/><text x="60" y="185" class="tableTitle">public.schema_migrations</text><text x="60" y="218" class="field">version (PK)</text><text x="60" y="239" class="field">checksum / applied_at</text><rect x="480" y="161" width="410" height="118" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="480" y="161" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="480" y="186" width="410" height="10" fill="#8b5d76"/><text x="492" y="185" class="tableTitle">auth.user</text><text x="492" y="218" class="field">id (PK)</text><text x="492" y="239" class="field">role / name / email</text><rect x="912" y="161" width="410" height="118" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="912" y="161" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="912" y="186" width="410" height="10" fill="#8b5d76"/><text x="924" y="185" class="tableTitle">auth.session</text><text x="924" y="218" class="field">id (PK)</text><text x="924" y="239" class="field">userId (FK → auth.user.id)</text><rect x="1344" y="161" width="410" height="118" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="1344" y="161" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="1344" y="186" width="410" height="10" fill="#8b5d76"/><text x="1356" y="185" class="tableTitle">auth.account</text><text x="1356" y="218" class="field">id (PK)</text><text x="1356" y="239" class="field">userId (FK → auth.user.id)</text><rect x="48" y="289" width="410" height="78" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="48" y="289" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="48" y="314" width="410" height="10" fill="#8b5d76"/><text x="60" y="313" class="tableTitle">auth.verification</text><text x="60" y="346" class="field">id (PK)</text><text x="60" y="367" class="field">identifier / value</text><text x="480" y="312" class="rel">auth.user 1 → 0..N auth.session (session.userId)</text><text x="480" y="341" class="rel">auth.user 1 → 0..N auth.account (account.userId)</text><text x="480" y="365" class="small">verification and migration ledger have no M3 foreign-key relationship.</text><rect x="25" y="410" width="1750" height="730" rx="14" fill="#fff" stroke="#decbd4" stroke-width="2"/><text x="48" y="445" class="phase">After M3-SQL-01 · Services &amp; Actions / Master Packages model</text><text x="48" y="469" class="phaseSub">Cumulative state: all current tables above + nine proposed catalogue, bundle, package and promotion tables + two type rows</text><rect x="48" y="489" width="410" height="158" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="48" y="489" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="48" y="514" width="410" height="10" fill="#8b5d76"/><text x="60" y="513" class="tableTitle">catalogue</text><text x="60" y="546" class="field">id (PK)</text><text x="60" y="567" class="field">catalogue_type_id (FK → catalogue_types.id)</text><text x="60" y="588" class="field">name / description / active</text><rect x="480" y="489" width="410" height="158" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="480" y="489" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="480" y="514" width="410" height="10" fill="#8b5d76"/><text x="492" y="513" class="tableTitle">bundle</text><text x="492" y="546" class="field">id (PK)</text><text x="492" y="567" class="field">name / description / active</text><rect x="912" y="489" width="410" height="158" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="912" y="489" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="912" y="514" width="410" height="10" fill="#8b5d76"/><text x="924" y="513" class="tableTitle">bundle_catalogue</text><text x="924" y="546" class="field">bundle_id (PK, FK → bundle.id)</text><text x="924" y="567" class="field">catalogue_id (PK, FK → catalogue.id)</text><rect x="1344" y="489" width="410" height="158" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="1344" y="489" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="1344" y="514" width="410" height="10" fill="#8b5d76"/><text x="1356" y="513" class="tableTitle">master_package</text><text x="1356" y="546" class="field">id (PK)</text><text x="1356" y="567" class="field">duration_minutes / base_price</text><text x="1356" y="588" class="field">published / active</text><rect x="48" y="659" width="410" height="158" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="48" y="659" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="48" y="684" width="410" height="10" fill="#8b5d76"/><text x="60" y="683" class="tableTitle">package_catalogue</text><text x="60" y="716" class="field">package_id (PK, FK → master_package.id)</text><text x="60" y="737" class="field">catalogue_id (PK, FK → catalogue.id)</text><rect x="480" y="659" width="410" height="158" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="480" y="659" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="480" y="684" width="410" height="10" fill="#8b5d76"/><text x="492" y="683" class="tableTitle">package_bundle</text><text x="492" y="716" class="field">package_id (PK, FK → master_package.id)</text><text x="492" y="737" class="field">bundle_id (PK, FK → bundle.id)</text><rect x="912" y="659" width="410" height="158" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="912" y="659" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="912" y="684" width="410" height="10" fill="#8b5d76"/><text x="924" y="683" class="tableTitle">promotion</text><text x="924" y="716" class="field">id (PK)</text><text x="924" y="737" class="field">discount_type / discount_value</text><text x="924" y="758" class="field">starts_at / ends_at / active</text><rect x="1344" y="659" width="410" height="158" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="1344" y="659" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="1344" y="684" width="410" height="10" fill="#8b5d76"/><text x="1356" y="683" class="tableTitle">promotion_package</text><text x="1356" y="716" class="field">promotion_id (PK, FK → promotion.id)</text><text x="1356" y="737" class="field">package_id (PK, FK → master_package.id)</text><rect x="48" y="827" width="1704" height="114" rx="8" fill="#f6ebf0"/><text x="63" y="848" class="rel">bundle 1 → 0..N bundle_catalogue ← N..0 ← 1 catalogue</text><text x="63" y="872" class="rel">master_package 1 → 0..N package_catalogue ← N..0 ← 1 catalogue</text><text x="63" y="896" class="rel">master_package 1 → 0..N package_bundle ← N..0 ← 1 bundle</text><text x="63" y="920" class="rel">promotion 1 → 0..N promotion_package ← N..0 ← 1 master_package</text><rect x="48" y="954" width="410" height="104" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="48" y="954" width="410" height="35" rx="9" fill="#8b5d76"/><rect x="48" y="979" width="410" height="10" fill="#8b5d76"/><text x="60" y="978" class="tableTitle">catalogue_types</text><text x="60" y="1011" class="field">id SMALLINT (PK)</text><text x="60" y="1032" class="field">code UNIQUE / label UNIQUE</text><text x="480" y="983" class="rel">catalogue_types 1 → 0..N catalogue (catalogue_type_id FK)</text><text x="480" y="1011" class="small">Production rows: 1 = Service; 2 = Action. FK delete: RESTRICT.</text><text x="63" y="1083" class="small">Composite PKs reject duplicate memberships. Direct and bundled catalogue IDs expand uniquely.</text><text x="63" y="1109" class="small">Retirement uses inactive state; no cascade deletes historical booking facts.</text><rect x="25" y="1160" width="1750" height="386" rx="14" fill="#fff" stroke="#decbd4" stroke-width="2"/><text x="48" y="1195" class="phase">After M3-SQL-04 · booking aggregate</text><text x="48" y="1219" class="phaseSub">Cumulative state: current + SQL-01 tables + booking and append-only status history</text><rect x="48" y="1238" width="842" height="184" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="48" y="1238" width="842" height="35" rx="9" fill="#8b5d76"/><rect x="48" y="1263" width="842" height="10" fill="#8b5d76"/><text x="60" y="1262" class="tableTitle">booking</text><text x="60" y="1295" class="field">id (PK); customer_id (FK → auth.user.id)</text><text x="60" y="1316" class="field">package_id (FK → master_package.id)</text><text x="60" y="1337" class="field">promotion_id (nullable FK → promotion.id)</text><text x="60" y="1358" class="field">wedding_date / status / snapshots</text><text x="60" y="1379" class="field">final_price / wedding_location</text><rect x="912" y="1238" width="842" height="184" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="912" y="1238" width="842" height="35" rx="9" fill="#8b5d76"/><rect x="912" y="1263" width="842" height="10" fill="#8b5d76"/><text x="924" y="1262" class="tableTitle">booking_status_history</text><text x="924" y="1295" class="field">id (PK); booking_id (FK → booking.id)</text><text x="924" y="1316" class="field">actor_id (FK → auth.user.id)</text><text x="924" y="1337" class="field">from_status / to_status / occurred_at</text><rect x="48" y="1440" width="1704" height="66" rx="8" fill="#f6ebf0"/><text x="63" y="1461" class="rel">auth.user 1 → 0..N booking; master_package 1 → 0..N booking; promotion 1 → 0..N booking (optional on booking)</text><text x="63" y="1485" class="rel">booking 1 → 1..N booking_status_history; auth.user 1 → 0..N booking_status_history (actor)</text><rect x="25" y="1566" width="1750" height="292" rx="14" fill="#fff" stroke="#decbd4" stroke-width="2"/><text x="48" y="1601" class="phase">After M3-SQL-07 · date protection</text><text x="48" y="1625" class="phaseSub">Cumulative state: all prior tables + admin closure table + partial unique successful-date index</text><rect x="48" y="1643" width="842" height="140" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="48" y="1643" width="842" height="35" rx="9" fill="#8b5d76"/><rect x="48" y="1668" width="842" height="10" fill="#8b5d76"/><text x="60" y="1667" class="tableTitle">admin_closed_date</text><text x="60" y="1700" class="field">date (PK)</text><text x="60" y="1721" class="field">closed_by (FK → auth.user.id)</text><text x="60" y="1742" class="field">created_at</text><rect x="912" y="1643" width="842" height="140" rx="9" fill="#fffafc" stroke="#cbaebd"/><rect x="912" y="1643" width="842" height="35" rx="9" fill="#8b5d76"/><rect x="912" y="1668" width="842" height="10" fill="#8b5d76"/><text x="924" y="1667" class="tableTitle">booking (new index)</text><text x="924" y="1700" class="field">UNIQUE wedding_date WHERE</text><text x="924" y="1721" class="field">status = 'Booking Berhasil'</text><text x="924" y="1742" class="field">pending status has no reservation</text><text x="63" y="1813" class="rel">auth.user 1 → 0..N admin_closed_date (closed_by)</text><text x="63" y="1841" class="rel">admin_closed_date.date ⇄ booking.wedding_date: exclusion by one transaction-level date lock, not an FK</text></svg>
